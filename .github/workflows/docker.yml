name: docker

# Every run builds the image and smoke-tests it. Pushes to main (tags :latest)
# and version tags like v1.2.3 (tags :1.2.3, :1.2 and :1) then publish it to
# GHCR. Pull requests never publish, so a fork or PR can't push an image.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    # Rebuilds :latest weekly even with no code change, to pick up patches to
    # the python:3.14-slim base image.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image from the Dockerfile
        run: docker build -t reminders-test .

      - name: Interpreter and package versions in the image
        run: |
          docker run --rm --entrypoint python reminders-test -c "import sys; from importlib.metadata import version as v; print(sys.version); print({p: v(p) for p in ['flask', 'requests', 'python-dotenv', 'gunicorn']})"

      # tests/ is in .dockerignore, so it is mounted rather than baked in.
      - name: Unit tests inside the image
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" --entrypoint python reminders-test -m unittest discover -s tests -v

      - name: TZ is honoured (the image has a timezone database)
        run: docker run --rm -e TZ=Europe/London --entrypoint python reminders-test -c "import time; print(time.tzname); assert time.tzname != ('UTC', 'UTC')"

      - name: Refuses to start without NTFY_TOPIC
        run: |
          if docker run --rm reminders-test; then
            echo "::error::the container started without NTFY_TOPIC"; exit 1
          fi

      - name: Start the container
        run: |
          docker run -d --name reminders --network host \
            -e NTFY_TOPIC=ci-topic -e NTFY_BASE_URL=http://127.0.0.1:9999 \
            -e NTFY_REMINDERS_URL=http://reminders.test:5000 reminders-test
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:5000/ && exit 0; sleep 1; done
          echo "::error::the server did not come up"; exit 1

      - name: Smoke test (UI, API, live dispatcher loop, notification headers)
        run: python3 tests/ci_smoke.py

      - name: Container reports healthy
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' reminders)" = healthy ] && exit 0
            sleep 2
          done
          docker inspect -f '{{json .State.Health}}' reminders
          echo "::error::the container never became healthy"; exit 1

      - name: Container logs (a traceback anywhere fails the job)
        if: always()
        run: |
          docker logs reminders 2>&1 | tail -80
          if docker logs reminders 2>&1 | grep -q Traceback; then
            echo "::error::traceback in the container logs"; exit 1
          fi

  publish:
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # The action lowercases the image name; GHCR rejects uppercase.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
          # Overrides the repo-description default. The source label (set by
          # the action) is what links the package to this repository.
          labels: |
            org.opencontainers.image.title=ntfy-reminders
            org.opencontainers.image.description=Self-hosted one-time and recurring reminders for ntfy

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
